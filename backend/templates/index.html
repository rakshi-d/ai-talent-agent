<!DOCTYPE html>
<html>
<head>
    <title>AI Talent Agent</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        textarea {
            width: 400px;
        }
        button {
            padding: 10px;
            margin-top: 10px;
        }
        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>AI Talent Scouting Agent 🚀</h2>

<textarea id="jd" rows="5" placeholder="Enter Job Description..."></textarea>
<br>
<button onclick="sendJD()">Find Candidates</button>

<h3>Results:</h3>

<table id="resultsTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Match Score</th>
            <th>Interest Score</th>
            <th>Final Score</th>
            <th>Chat Response</th>
            <th>Explanation</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function sendJD() {
    let jd = document.getElementById("jd").value;

    let response = await fetch("http://127.0.0.1:5000/process", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ jd: jd })
    });

    let data = await response.json();

    let tableBody = document.querySelector("#resultsTable tbody");
    tableBody.innerHTML = "";

    if (data.length === 0) {
        tableBody.innerHTML =
            "<tr><td colspan='6'>No suitable candidates found</td></tr>";    
        return;
    }


    data.forEach(candidate => {
        let row = `<tr>
            <td>${candidate.name}</td>
            <td>${candidate.match_score}</td>
            <td>${candidate.interest_score}</td>
            <td>${candidate.final_score}</td>
            <td>${candidate.chat_response}</td>
            <td>${candidate.explanation.join(", ")}</td>
        </tr>`;
        tableBody.innerHTML += row;
    });
}
</script>

</body>
</html>
